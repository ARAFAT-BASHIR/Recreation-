<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Kiteezi Recreational Center</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-page-bg">

  <div class="admin-container">
    
    <div id="admin-login-view" class="admin-card">
      <h2><i class="fa-solid fa-user-lock"></i> Kiteezi Admin Portal</h2>
      <form onsubmit="handleAdminLogin(event)">
        <input type="password" id="admin-pass-input" placeholder="Enter Admin Passcode" required>
        <button type="submit" class="btn-primary full-width-btn" style="margin-top:1rem;">Unlock Dashboard</button>
      </form>
    </div>

    <div id="admin-dashboard-view" class="admin-card admin-wide" style="display: none;">
      <div class="admin-header">
        <h2><i class="fa-solid fa-gauge"></i> Management Dashboard</h2>
        <button onclick="location.reload()" class="btn-secondary-sm">Logout</button>
      </div>

      <!-- MEDIA & ANNOUNCEMENT CONTROL -->
      <div class="admin-form-box" style="margin-bottom: 2rem;">
        <h3><i class="fa-solid fa-bullhorn"></i> Announcement & Media Control</h3>
        <form onsubmit="updateAnnouncement(event)">
          <label>Top Announcement Bar Text:</label>
          <input type="text" id="admin-announcement-input" placeholder="e.g., Special Event: Pool Party Every Last Saturday of the Month!" required>
          <button type="submit" class="btn-primary-sm" style="margin-top:0.5rem;">Update Live Banner</button>
        </form>
      </div>

      <!-- MENU & BUFFET CONTROLS -->
      <div class="admin-content-grid">
        <div class="admin-form-box">
          <h3>Add Menu Item</h3>
          <form onsubmit="handleSaveMenuItem(event)">
            <input type="text" id="menu-title-input" placeholder="Item Name" required>
            
            <div class="two-col-inputs">
              <input type="number" id="menu-price-input" placeholder="Price (UGX)" required>
              <select id="menu-category-input" required>
                <option value="breakfast">Breakfast & Snacks</option>
                <option value="chicken">Chicken</option>
                <option value="fish">Fish</option>
                <option value="goat">Goat</option>
                <option value="liver">Liver</option>
                <option value="burgers-pizza">Burgers & Pizzas</option>
              </select>
            </div>

            <input type="text" id="menu-img-input" placeholder="Image URL">

            <div class="checkbox-row">
              <label><input type="checkbox" id="menu-sides-check"> Requires Side</label>
              <label><input type="checkbox" id="menu-avail-check" checked> In Stock</label>
            </div>

            <button type="submit" class="btn-primary full-width-btn" style="margin-top:1rem;">Save to Supabase</button>
          </form>
        </div>

        <div class="admin-items-list-container">
          <h3>Live Database Items</h3>
          <div id="admin-menu-render-list" class="admin-item-scroll"></div>
        </div>
      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
