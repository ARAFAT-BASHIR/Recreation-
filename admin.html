<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | Kiteezi Recreational Center</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-page-bg">

  <div class="admin-container" style="max-width: 900px; margin: 40px auto; padding: 20px;">
    
    <!-- LOGIN FORM -->
    <div id="admin-login-card" class="admin-card" style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
      <h2><i class="fa-solid fa-user-shield"></i> Kiteezi Admin Login</h2>
      <p style="margin-bottom: 20px; color: #666;">Sign in with your Supabase Admin account</p>

      <form onsubmit="handleSupabaseLogin(event)">
        <div style="margin-bottom: 15px;">
          <label style="display:block; margin-bottom: 5px;">Email Address</label>
          <input type="email" id="admin-email" placeholder="admin@kiteezi.com" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 15px;">
          <label style="display:block; margin-bottom: 5px;">Password</label>
          <input type="password" id="admin-password" placeholder="••••••••" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; background: #e63946; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
          Sign In
        </button>
      </form>

      <div style="margin-top: 15px; text-align: center;">
        <a href="#" onclick="toggleRecoveryView(true)" style="color: #e63946; font-size: 0.9rem;">Forgot Password / Recovery?</a>
      </div>
    </div>

    <!-- RECOVERY FORM -->
    <div id="admin-recovery-card" class="admin-card" style="display: none; background: white; padding: 30px; border-radius: 8px;">
      <h2><i class="fa-solid fa-key"></i> Password Recovery</h2>
      <p style="margin-bottom: 20px; color: #666;">Enter your admin email to send a reset link.</p>

      <form onsubmit="handlePasswordRecovery(event)">
        <div style="margin-bottom: 15px;">
          <label style="display:block; margin-bottom: 5px;">Admin Email</label>
          <input type="email" id="recovery-email" placeholder="admin@kiteezi.com" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; background: #e63946; color: white; border: none; border-radius: 4px; cursor: pointer;">
          Send Reset Link
        </button>
      </form>

      <div style="margin-top: 15px; text-align: center;">
        <a href="#" onclick="toggleRecoveryView(false)" style="color: #666; font-size: 0.9rem;">Back to Login</a>
      </div>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="admin-dashboard-view" class="admin-card" style="display: none; background: white; padding: 30px; border-radius: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px;">
        <div>
          <h2 style="margin: 0;"><i class="fa-solid fa-gauge"></i> Kiteezi Dashboard</h2>
          <span id="logged-in-user-email" style="font-size: 0.85rem; color: #666;"></span>
        </div>
        <button onclick="handleSupabaseLogout()" style="padding: 8px 16px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer;">Logout</button>
      </div>

      <!-- ANNOUNCEMENT BANNER CONTROL -->
      <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-bottom: 20px;">
        <h3><i class="fa-solid fa-bullhorn"></i> Top Announcement Banner</h3>
        <form onsubmit="updateAnnouncement(event)" style="display: flex; gap: 10px; margin-top: 10px;">
          <input type="text" id="admin-announcement-input" placeholder="e.g., Special Event: Pool Party Every Last Saturday!" required style="flex: 1; padding: 8px;">
          <button type="submit" style="padding: 8px 16px; background: #e63946; color: white; border: none; border-radius: 4px; cursor: pointer;">Update Banner</button>
        </form>
      </div>

      <!-- MENU ITEM MANAGEMENT -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div style="background: #f8f9fa; padding: 15px; border-radius: 6px;">
          <h3>Add Menu Item</h3>
          <form onsubmit="handleSaveMenuItem(event)" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
            <input type="text" id="menu-title-input" placeholder="Item Name" required style="padding: 8px;">
            
            <div style="display: flex; gap: 10px;">
              <input type="number" id="menu-price-input" placeholder="Price (UGX)" required style="flex: 1; padding: 8px;">
              <select id="menu-category-input" required style="flex: 1; padding: 8px;">
                <option value="breakfast">Breakfast & Snacks</option>
                <option value="chicken">Chicken</option>
                <option value="fish">Fish</option>
                <option value="goat">Goat</option>
                <option value="liver">Liver</option>
                <option value="burgers-pizza">Burgers & Pizzas</option>
              </select>
            </div>

            <input type="text" id="menu-img-input" placeholder="Image URL (optional)" style="padding: 8px;">

            <div style="display: flex; gap: 15px; font-size: 0.9rem;">
              <label><input type="checkbox" id="menu-sides-check"> Requires Side</label>
              <label><input type="checkbox" id="menu-avail-check" checked> Available</label>
            </div>

            <button type="submit" style="padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Save Item</button>
          </form>
        </div>

        <div style="background: #f8f9fa; padding: 15px; border-radius: 6px;">
          <h3>Active Items List</h3>
          <div id="admin-menu-render-list" style="max-height: 350px; overflow-y: auto; margin-top: 10px;"></div>
        </div>
      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
