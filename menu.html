<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Menu | Kiteezi Recreational Center</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="navbar">
    <div class="logo"><a href="index.html" style="color:white; text-decoration:none;">Kiteezi <span>Recreational Center</span></a></div>
    <div class="header-actions">
      <button class="cart-btn" onclick="toggleCartDrawer()">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-badge" id="cart-badge-count">0</span>
      </button>
    </div>
  </header>

  <section class="menu-page-header">
    <h1>Our Live Restaurant Menu</h1>
    <p>Select your favorite food, pick cooking styles, and order directly on WhatsApp.</p>
  </section>

  <section id="restaurant" class="section menu-section">
    <div class="container">
      
      <!-- MENU CATEGORIES INCLUDING BREAKFAST & SNACKS -->
      <div class="menu-tabs">
        <button class="tab-btn active" onclick="filterCategory('all', this)">All Items</button>
        <button class="tab-btn" onclick="filterCategory('breakfast', this)">Breakfast & Snacks</button>
        <button class="tab-btn" onclick="filterCategory('chicken', this)">Chicken</button>
        <button class="tab-btn" onclick="filterCategory('fish', this)">Fish</button>
        <button class="tab-btn" onclick="filterCategory('goat', this)">Goat</button>
        <button class="tab-btn" onclick="filterCategory('liver', this)">Liver</button>
        <button class="tab-btn" onclick="filterCategory('burgers-pizza', this)">Burgers & Pizzas</button>
      </div>

      <div class="menu-grid" id="menu-grid">
        <!-- Live items from Supabase database -->
      </div>
    </div>
  </section>

  <!-- CART DRAWER -->
  <div id="cart-drawer" class="cart-drawer">
    <div class="cart-header">
      <h3><i class="fa-solid fa-cart-shopping"></i> Your Order</h3>
      <span class="close-btn" onclick="toggleCartDrawer()">&times;</span>
    </div>
    
    <div class="cart-items-body" id="cart-items-list"></div>

    <div class="cart-footer">
      <div class="cart-summary-line">
        <span>Total:</span>
        <strong id="cart-total-price">0 UGX</strong>
      </div>
      
      <input type="text" id="cust-name" placeholder="Your Name" required>
      <input type="tel" id="cust-phone" placeholder="Phone Number" required>
      <input type="text" id="cust-location" placeholder="Table / Delivery Spot">

      <button class="whatsapp-btn" onclick="checkoutToWhatsApp()">
        <i class="fa-brands fa-whatsapp"></i> Send Order via WhatsApp
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
